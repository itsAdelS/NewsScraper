kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Run the TypeScript build first, then install Playwright's Chromium browser
# into .playwright-browsers/ (a workspace path captured in the Repl layer).
# The .cache/ directory is excluded from the production image, so browsers
# must be stored here via PLAYWRIGHT_BROWSERS_PATH (set in the run script).
args = ["bash", "-c", "pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/api-server run install-browsers"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Use the wrapper script so Playwright's Chromium binary can find
# libgbm.so.1 and libudev.so.1 on NixOS/Replit in production.
args = ["bash", "artifacts/api-server/scripts/start-with-libs.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
